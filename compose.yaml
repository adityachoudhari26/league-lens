name: league-lens
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: league_lens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-league_lens_local}
      POSTGRES_DB: league_lens
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league_lens -d league_lens"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
