name: league-lens
services:
  postgres:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: league_lens
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-league_lens_local}
      POSTGRES_DB: league_lens
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U league_lens -d league_lens"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
  app:
    build: .
    image: league-lens:local
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LEAGUE_LENS_PORT:-80}:8080"
    environment:
      DATABASE_URL: postgres://league_lens:${POSTGRES_PASSWORD:-league_lens_local}@postgres:5432/league_lens?sslmode=disable
      LOCAL_OWNER_EMAIL: ${LOCAL_OWNER_EMAIL:-owner@localhost}
      ESPN_S2: ${ESPN_S2:-}
      ESPN_SWID: ${ESPN_SWID:-}
    volumes:
      - app_data:/data
volumes:
  postgres_data:
  app_data:
