syntax = "proto3";
package leaguelens.v1;

import "google/protobuf/timestamp.proto";
import "leaguelens/v1/overview.proto";

option go_package = "github.com/adityachoudhari26/league-lens/internal/gen/leaguelens/v1;leaguelensv1";

// DashboardService reads imported data and records alert dismissals for the
// server's configured local owner. It never calls a provider or accepts a
// caller-selected user identity.
service DashboardService {
  rpc GetOverviewAttention(GetOverviewAttentionRequest) returns (GetOverviewAttentionResponse);
  rpc DismissLineupAlert(DismissLineupAlertRequest) returns (DismissLineupAlertResponse);
  rpc RestoreLineupAlert(RestoreLineupAlertRequest) returns (RestoreLineupAlertResponse);
  rpc GetOverviewMatchups(GetOverviewMatchupsRequest) returns (GetOverviewMatchupsResponse);
  rpc GetOverviewPlayerUpdates(GetOverviewPlayerUpdatesRequest) returns (GetOverviewPlayerUpdatesResponse);
  rpc GetOverviewLookingAhead(GetOverviewLookingAheadRequest) returns (GetOverviewLookingAheadResponse);
  rpc ListLeagues(ListLeaguesRequest) returns (ListLeaguesResponse);
  rpc GetLeague(GetLeagueRequest) returns (GetLeagueResponse);
  rpc GetTeamRoster(GetTeamRosterRequest) returns (GetTeamRosterResponse);
  rpc ListMatchups(ListMatchupsRequest) returns (ListMatchupsResponse);
  rpc GetMatchupDetail(GetMatchupDetailRequest) returns (GetMatchupDetailResponse);
  // GetPlayerCard is the one read that may contact a profile source: it serves
  // the cached profile, refetching it once 12 hours old. NOT_FOUND for an
  // unknown player_id.
  rpc GetPlayerCard(GetPlayerCardRequest) returns (GetPlayerCardResponse);
}
message ListLeaguesRequest {
  int32 page_size = 1; // Default 25, maximum 100.
  string page_token = 2;
}
message ListLeaguesResponse {
  repeated League leagues = 1;
  string next_page_token = 2;
}
message GetLeagueRequest {
  string league_season_id = 1;
}
message GetLeagueResponse {
  League league = 1;
  repeated Team teams = 2;
  repeated int32 available_matchup_periods = 3;
}
message League {
  string id = 1;
  string provider = 2;
  string external_id = 3;
  int32 season = 4;
  string name = 5;
  repeated string selected_team_ids = 6;
  google.protobuf.Timestamp last_successful_sync_at = 7;
}
message Team {
  string id = 1;
  string external_id = 2;
  string name = 3;
  bool selected = 4;
  TeamRecord record = 5; // Absent when unknown. Not a historical record.
  optional int32 rank = 6; // Provider rank only; no invented tie-breaking rules.
}
message TeamRecord {
  int32 wins = 1;
  int32 losses = 2;
  int32 ties = 3;
  optional double points_for = 4;
  optional double points_against = 5;
}
message GetTeamRosterRequest {
  string team_id = 1;
  // Omit for latest observed roster. Explicit weeks may return provider history.
  optional int32 scoring_period = 2;
}
message GetTeamRosterResponse {
  // Absent means no snapshot available; present with no entries means known empty.
  RosterSnapshot snapshot = 1;
}
message RosterSnapshot {
  string id = 1;
  string team_id = 2;
  int32 scoring_period = 3;
  string origin = 4;
  string coverage = 5;
  google.protobuf.Timestamp observed_at = 6;
  google.protobuf.Timestamp effective_at = 7;
  repeated RosterEntry entries = 8;
}
message RosterEntry {
  string player_id = 1;
  string player_name = 2;
  string player_kind = 3;
  string slot = 4;
  string provider_slot_id = 5;
  // Absent means unknown; present with no values means explicitly empty.
  Positions eligible_positions = 6;
}
message Positions {
  repeated string values = 1;
}
message ListMatchupsRequest {
  string league_season_id = 1;
  int32 matchup_period = 2; // A matchup round, not necessarily one scoring week.
}
message ListMatchupsResponse {
  repeated Matchup matchups = 1;
}
message Matchup {
  string id = 1;
  string external_id = 2;
  int32 matchup_period = 3;
  ScoringPeriods scoring_periods = 4; // Absent means unknown.
  MatchupSide team_a = 5;
  MatchupSide team_b = 6; // Absent is not automatically a bye.
  bool is_bye = 7;
  string status = 8;
  google.protobuf.Timestamp fetched_at = 9;
}
message ScoringPeriods {
  repeated int32 values = 1;
}
message MatchupSide {
  string team_id = 1;
  optional double score = 2; // Absence and actual zero are distinct.
}

message GetMatchupDetailRequest {
  // The owner's team is the league's selected team; user_teams allows at most one.
  string league_season_id = 1;
  // Omit for the round containing the observed scoring week (as on Overview).
  optional int32 matchup_period = 2;
}
message GetMatchupDetailResponse {
  // Absent means no matchup is stored for the owner's team and round.
  MatchupDetail matchup = 1;
}
// MatchupDetail is oriented around the owner: team is always the
// owner's side, opponent the other side.
message MatchupDetail {
  string id = 1;
  int32 matchup_period = 2;
  MatchupStatus status = 3;
  bool is_bye = 4;
  MatchupLineup team = 5;
  MatchupLineup opponent = 6; // Absent on a bye.
  google.protobuf.Timestamp fetched_at = 7;
}
enum MatchupStatus {
  MATCHUP_STATUS_UNSPECIFIED = 0;
  MATCHUP_STATUS_SCHEDULED = 1;
  MATCHUP_STATUS_IN_PROGRESS = 2;
  MATCHUP_STATUS_FINAL = 3;
  MATCHUP_STATUS_UNKNOWN = 4;
}
message MatchupLineup {
  string team_id = 1;
  string team_name = 2;
  TeamRecord record = 3; // Absent when unknown. Current record, not as of this round.
  optional double score = 4; // Absence and actual zero are distinct.
  int32 starters_left_to_play = 5; // Starters whose game has not kicked off.
  // Starters by slot (QB, RB, WR, TE, FLEX, SUPERFLEX, DEF, K, then others); bench
  // by BENCH, TAXI, IR, then others. Ties: points (highest first), then name, then player ID.
  repeated LineupPlayer starters = 6;
  repeated LineupPlayer bench = 7;
  // Starters' actual points once their game kicks off, projected points before
  // (missing counts as zero). Absent when no starter has a projection.
  optional double projected_score = 8;
}
message LineupPlayer {
  string player_id = 1;
  string player_name = 2;
  string slot = 3;
  optional double points = 4; // Absent means not reported, distinct from zero.
  InjuryStatus injury_status = 5; // Current status, not as of this round.
  string pro_team = 6; // Empty when unknown.
  GameState game_state = 7;
  google.protobuf.Timestamp kickoff_at = 8; // Absent unless a game is scheduled.
  optional double projected_points = 9; // Provider's latest projection; never a stand-in for points.
}
// GameState is derived from nfl_games kickoffs. Live and final are not
// distinguished; both are KICKED_OFF.
enum GameState {
  GAME_STATE_UNSPECIFIED = 0;
  GAME_STATE_NOT_STARTED = 1;
  GAME_STATE_KICKED_OFF = 2;
  GAME_STATE_BYE = 3;
  GAME_STATE_UNKNOWN = 4; // No NFL team or no schedule for the week.
}

message GetPlayerCardRequest {
  string player_id = 1;
}
message GetPlayerCardResponse {
  PlayerCard card = 1;
}
// PlayerCard combines stored player data with the player's source profile.
// Profile fields are empty or absent when the source didn't report them, and
// all of them are when no profile could be fetched (profile_fetched_at absent).
// A profile older than 12 hours is served only when a refetch fails.
message PlayerCard {
  string player_id = 1;
  string player_name = 2;
  PlayerKind player_kind = 3;
  string pro_team = 4; // Empty when unknown.
  string position = 5; // QB, RB, WR, TE, K, or DEF. Empty when unknown.
  InjuryStatus injury_status = 6; // Current status.
  NextGame next_game = 7; // Absent when no upcoming game is stored.
  string headshot_url = 8; // Team logo for D/ST. Empty when unknown.
  string jersey = 9; // Empty when unknown.
  optional int32 age = 10; // Whole years from birth date.
  optional int32 height_inches = 11;
  optional int32 weight_lbs = 12;
  string college = 13; // Empty when unknown.
  PlayerDraft draft = 14; // Absent when undrafted or unknown.
  optional int32 position_rank = 15; // Season-to-date fantasy rank at the player's position.
  optional double percent_rostered = 16; // 0-100 across the source's fantasy leagues.
  optional double percent_started = 17; // 0-100 across the source's fantasy leagues.
  PlayerBlurb blurb = 18; // Absent when no blurb is available.
  repeated PlayerStat season_stats = 19; // Source display order; position-specific.
  google.protobuf.Timestamp profile_fetched_at = 20;
}
enum PlayerKind {
  PLAYER_KIND_UNSPECIFIED = 0;
  PLAYER_KIND_PERSON = 1;
  PLAYER_KIND_TEAM_DEFENSE = 2;
}
message NextGame {
  string opponent = 1; // NFL team abbreviation.
  google.protobuf.Timestamp kickoff_at = 2;
}
message PlayerDraft {
  int32 year = 1;
  int32 round = 2;
  int32 pick = 3;
}
// PlayerBlurb is the best available write-up, in order: this NFL week's
// outlook, the latest stored news, then the season outlook.
message PlayerBlurb {
  PlayerBlurbKind kind = 1;
  string text = 2; // News uses the item's summary, or its headline when it has none.
  optional int32 week = 3; // Weekly outlook only.
  google.protobuf.Timestamp published_at = 4; // News only.
  string url = 5; // News only.
}
enum PlayerBlurbKind {
  PLAYER_BLURB_KIND_UNSPECIFIED = 0;
  PLAYER_BLURB_KIND_WEEKLY_OUTLOOK = 1;
  PLAYER_BLURB_KIND_NEWS = 2;
  PLAYER_BLURB_KIND_SEASON_OUTLOOK = 3;
}
message PlayerStat {
  string label = 1; // Source's short label, e.g. "Rush Yards".
  double value = 2;
  optional int32 rank = 3; // League rank for the stat; absent when unranked.
}
